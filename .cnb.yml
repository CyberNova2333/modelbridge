.check-code: &check-code
  name: 语法、构建与回归测试
  script: |
    set -eu
    corepack enable
    pnpm run check
    pnpm run build
    node --test tests/*.test.mjs

.build-docs: &build-docs
  name: 构建并核对文档站
  script: |
    set -eu
    corepack enable
    pnpm --dir docs-site install --frozen-lockfile
    pnpm --dir docs-site run test:smoke
    pnpm --dir docs-site run docs:build
    test -f docs-site/.vitepress/dist/index.html

main:
  push:
    - name: 持续集成与构建检查
      docker:
        image: node:24-bookworm
      lock:
        key: checks_main
        wait: true
        cancel-in-wait: true
      stages:
        - *check-code
        - *build-docs

$:
  web_trigger_check:
    - name: 手动构建检查（不发布）
      docker:
        image: node:24-bookworm
      lock:
        key: checks_manual
        wait: true
        cancel-in-wait: true
      stages:
        - *check-code
        - *build-docs
