name = "modelbridge-state"
main = "worker.js"
compatibility_date = "2026-06-30"
compatibility_flags = ["global_fetch_strictly_public", "enable_request_signal"]
workers_dev = true
preview_urls = false

# Reuse the existing configuration owner. Do not add a new DO migration here.
[[durable_objects.bindings]]
name = "CONFIG_STORE"
class_name = "AppConfigStore"
script_name = "REPLACE_WITH_CONFIG_OWNER_WORKER_NAME"

# MODELBRIDGE_STATE_TOKEN and MODELBRIDGE_STATE_ORIGINS are separate Secrets.
# This service does not need ADMIN_PASSWORD or a KV binding.
[observability]
redact_query_string = true

[observability.logs]
enabled = false
